<!doctype html>
<html lang="en">
  <head>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="CivilMath" />
    <title>Civil Engineering Calculators & Design Tools | CivilMath</title>
    <meta name="google-site-verification" content="google49128c281cadcc5f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CivilMath" />
    <meta name="theme-color" content="#657565" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        } else {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const r of registrations) {
              r.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((keys) => {
              for (const k of keys) {
                caches.delete(k);
              }
            });
          }
        }
      }
    </script>
  </head>
  <body>
    <!-- ── CivilMath Site Loader ── Shown before React hydrates -->
    <div id="cm-splash" aria-hidden="true">
      <style>
        #cm-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          background: #F3F1EC;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: 'JetBrains Mono', 'Courier New', monospace;
          transition: opacity 0.45s ease;
        }
        #cm-splash.hiding {
          opacity: 0;
          pointer-events: none;
        }
        /* Blueprint grid */
        #cm-splash::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(to right, #657565 1px, transparent 1px),
            linear-gradient(to bottom, #657565 1px, transparent 1px);
          background-size: 40px 40px;
          opacity: 0.08;
          pointer-events: none;
        }
        /* Logo mark */
        .cm-logo { position: relative; width: 56px; height: 56px; margin-bottom: 20px; }
        .cm-logo-outer {
          position: absolute; inset: 0;
          border: 2px solid #657565; border-radius: 14px;
          animation: cm-pulse 1.6s ease-in-out infinite;
        }
        .cm-logo-inner {
          position: absolute; inset: 10px;
          background: #657565; border-radius: 6px;
          display: flex; align-items: center; justify-content: center;
          color: #F3F1EC; font-size: 14px; font-weight: 700; letter-spacing: -0.5px;
        }
        .cm-wordmark { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #20231F; margin-bottom: 6px; }
        .cm-wordmark span { color: #657565; }
        .cm-tagline { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #7B8978; margin-bottom: 36px; }
        .cm-bar-track { width: 160px; height: 3px; background: #D8D0C2; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
        .cm-bar-fill {
          height: 100%; background: #657565; border-radius: 99px;
          width: 0%; animation: cm-progress 1.1s cubic-bezier(0.4,0,0.2,1) forwards; animation-delay: 0.1s;
        }
        .cm-status { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: #9A9E97; }
        .cm-coord { position: absolute; font-size: 8px; color: #C0C4BB; letter-spacing: 0.05em; }
        .cm-coord.tl { top: 16px; left: 20px; }
        .cm-coord.tr { top: 16px; right: 20px; text-align: right; }
        .cm-coord.bl { bottom: 16px; left: 20px; }
        .cm-coord.br { bottom: 16px; right: 20px; text-align: right; }
        @keyframes cm-pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50%       { opacity: 0.55; transform: scale(0.93); }
        }
        @keyframes cm-progress {
          0%   { width: 0%; }
          60%  { width: 75%; }
          100% { width: 100%; }
        }
        @media (prefers-color-scheme: dark) {
          #cm-splash { background: #1A1D1A; }
          .cm-wordmark { color: #EAE7E0; }
          .cm-bar-track { background: #384238; }
          .cm-logo-inner { color: #1A1D1A; }
          .cm-coord { color: #2D352D; }
        }
      </style>
      <div class="cm-coord tl">X: 0.000<br>Y: 0.000</div>
      <div class="cm-coord tr">SCALE 1:100<br>METRIC</div>
      <div class="cm-coord bl">REV: 2026</div>
      <div class="cm-coord br">civilmath.com</div>
      <div class="cm-logo">
        <div class="cm-logo-outer"></div>
        <div class="cm-logo-inner">CM</div>
      </div>
      <div class="cm-wordmark">Civil<span>Math</span></div>
      <div class="cm-tagline">Precision Engineering Tools</div>
      <div class="cm-bar-track"><div class="cm-bar-fill"></div></div>
      <div class="cm-status">Loading workspace…</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
