<!doctype html>
<html lang="en">
  <head>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="CivilMath" />
    <title>Civil Engineering Calculators & Design Tools | CivilMath</title>
    <meta name="google-site-verification" content="google49128c281cadcc5f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CivilMath" />
    <meta name="theme-color" content="#2E6B56" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js?v=2').catch(() => {});
          });
        } else {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const r of registrations) {
              r.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((keys) => {
              for (const k of keys) {
                caches.delete(k);
              }
            });
          }
        }
      }
    </script>
  </head>
  <body>
    <!-- ── CivilMath Site Loader ── Shown before React hydrates -->
    <div id="cm-splash" aria-hidden="true">
      <style>
        #cm-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          background: #F7F8F7;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: 'JetBrains Mono', 'Courier New', monospace;
          transition: opacity 0.45s ease;
        }
        #cm-splash.hiding {
          opacity: 0;
          pointer-events: none;
        }
        /* Blueprint grid */
        #cm-splash::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(to right, rgba(46, 107, 86, 0.06) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(46, 107, 86, 0.06) 1px, transparent 1px);
          background-size: 32px 32px;
          pointer-events: none;
        }
        /* Logo mark */
        .cm-logo { position: relative; width: 52px; height: 52px; margin-bottom: 20px; }
        .cm-logo-outer {
          position: absolute; inset: 0;
          border: 1.5px solid #2E6B56; border-radius: 12px;
          animation: cm-pulse 1.6s ease-in-out infinite;
        }
        .cm-logo-inner {
          position: absolute; inset: 8px;
          background: #2E6B56; border-radius: 6px;
          display: flex; align-items: center; justify-content: center;
          color: #FFFFFF; font-size: 13px; font-weight: 700; letter-spacing: -0.5px;
        }
        .cm-wordmark { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: #141A16; margin-bottom: 6px; }
        .cm-wordmark span { color: #2E6B56; }
        .cm-tagline { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #7A8981; margin-bottom: 32px; }
        .cm-bar-track { width: 140px; height: 2.5px; background: #E2E6E2; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
        .cm-bar-fill {
          height: 100%; background: #2E6B56; border-radius: 99px;
          width: 0%; animation: cm-progress 1.1s cubic-bezier(0.4,0,0.2,1) forwards; animation-delay: 0.1s;
        }
        .cm-status { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #7A8981; }
        .cm-coord { position: absolute; font-size: 8.5px; color: #7A8981; letter-spacing: 0.06em; }
        .cm-coord.tl { top: 18px; left: 20px; }
        .cm-coord.tr { top: 18px; right: 20px; text-align: right; }
        .cm-coord.bl { bottom: 18px; left: 20px; }
        .cm-coord.br { bottom: 18px; right: 20px; text-align: right; }
        @keyframes cm-pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50%       { opacity: 0.55; transform: scale(0.95); }
        }
        @keyframes cm-progress {
          0%   { width: 0%; }
          60%  { width: 75%; }
          100% { width: 100%; }
        }
        @media (prefers-color-scheme: dark) {
          #cm-splash { background: #090B0A; }
          #cm-splash::before {
            background-image:
              linear-gradient(to right, rgba(52, 211, 153, 0.08) 1px, transparent 1px),
              linear-gradient(to bottom, rgba(52, 211, 153, 0.08) 1px, transparent 1px);
          }
          .cm-logo-outer { border-color: #34D399; }
          .cm-logo-inner { background: #34D399; color: #090B0A; }
          .cm-wordmark { color: #ECF2EE; }
          .cm-wordmark span { color: #34D399; }
          .cm-bar-track { background: #1B221E; }
          .cm-bar-fill { background: #34D399; }
          .cm-coord { color: #64736B; }
          .cm-status { color: #64736B; }
        }
      </style>
      <div class="cm-coord tl">X: 0.000<br>Y: 0.000</div>
      <div class="cm-coord tr">SCALE 1:100<br>METRIC</div>
      <div class="cm-coord bl">REV: 2026</div>
      <div class="cm-coord br">civilmath.com</div>
      <div class="cm-logo">
        <div class="cm-logo-outer"></div>
        <div class="cm-logo-inner">CM</div>
      </div>
      <div class="cm-wordmark">Civil<span>Math</span></div>
      <div class="cm-tagline">Precision Engineering Tools</div>
      <div class="cm-bar-track"><div class="cm-bar-fill"></div></div>
      <div class="cm-status">Loading workspace…</div>
    </div>


    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
